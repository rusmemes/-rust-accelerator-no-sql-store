[package]
name = "no-sql-store-client"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = "1.8"
futures = "0.3"
thiserror = "2"
tokio = { version = "1.49.0", features = ["rt", "sync", "time"] }
tokio-stream = "0.1.18"
tonic = "0.14.5"
uuid = { version = "1.23.4", features = ["v7"] }
no-sql-store-proto = { path = "../no-sql-store-proto" }
